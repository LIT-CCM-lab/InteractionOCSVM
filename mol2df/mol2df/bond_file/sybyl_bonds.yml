# Single bonds

C.2 C.ar: 1 #treat bonds between sp2 carbons and aromatic carbons as single bonds
C.1 C.ar: 1 #treat bonds between sp carbons and aromatic carbons as single bonds

# Double bonds
C.2 C.2: 2
C.2 N.2: 2
C.2 O.2: 2
C.2 S.2: 2
C.2 N.pl3: 2
S.2 O.2: 2
N.2 O.2: 2

# Triple bonds
C.1 C.1: 3
C.1 N.1: 3

# Aromatic bonds
C.ar C.ar: ar
C.ar N.ar: ar
C.ar N.pl3: ar
C.2 O.co2: ar #treat bonds between the oxygens of charged carboxylic group and the sp2 carbon to describe the resonance between structures
N.pl3 C.cat: ar #treat the bond as aromatic to consider the resonance

# Amide bonds
N.am C.2: am


