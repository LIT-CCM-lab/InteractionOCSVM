[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = 'pyichem'
version = '0.2'
authors = [{name = 'Luca Chiesa', email = 'luca.chiesa@unistra.fr'}]
description = 'Package to interact with the IChem software from a python interface'
license = {text = "MIT"}
requires-python = ">=3.7"
dependencies = ['numpy', 'pandas', 'grakel', 'scipy', 'matplotlib']

[project.urls]
Homepage = 'https://github.com/LIT-CCM-lab/InteractionOCSVM'