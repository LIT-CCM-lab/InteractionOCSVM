[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = 'mol2df'
version = '0.1'
authors = [{name = 'Luca Chiesa', email = 'luca.chiesa@unistra.fr'}]
description = 'Package to read and write mol2 files from and to pandas dataframes. Includes support for MD simulation via the pytraj package'
license = {text = "MIT"}
requires-python = ">=3.7"
dependencies = ['numpy', 'pandas', 'pytraj']

[project.urls]
Homepage = 'https://github.com/LIT-CCM-lab/InteractionOCSVM'