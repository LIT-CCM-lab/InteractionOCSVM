# Protein atoms
-  H  # polar H
-  HC # N-ter H
-  HA # nonpolar H
-  HP # aromatic H
-  HB1 # backbone H
-  HB2 # aliphatic backbone H, to CT2
-  HR1 # his he1, (+) his HG,HD2
-  HR2 # (+) his HE1
-  HR3 # neutral his HG, HD2
-  HS # thiol hydrogen
-  HE1 # for alkene; RHC=CR
-  HE2 # for alkene; H2C=CR
-  HA1 # alkane, CH, new LJ params (see toppar_all22_prot_aliphatic_c27.str)
-  HA2 # alkane, CH2, new LJ params (see toppar_all22_prot_aliphatic_c27.str)
-  HA3 # alkane, CH3, new LJ params (see toppar_all22_prot_aliphatic_c27.str)
-  CT # aliphatic sp3 C, new LJ params, no hydrogens
-  CT1 # aliphatic sp3 C for CH
-  CT2 # aliphatic sp3 C for CH2
-  CT2A # from CT2 (asp, glu, hsp chi1/chi2 fitting)
-  CT3 # aliphatic sp3 C for CH3
-  CPT # trp C between rings
-  CP1 # tetrahedral C (proline CA)
-  CP2 # tetrahedral C (proline CB/CG)
-  CP3 # tetrahedral C (proline CD)
-  C3 # cyclopropane carbon
-  N # proline N
-  NH1  # peptide nitrogen
-  NH2  # amide nitrogen
-  NH3  # ammonium nitrogen
-  NP   # Proline ring NH2+ (N-terminal)
-  OH1  # hydroxyl oxygen
-  OS   # ester oxygen
-  S    # sulphur
-  SM   # sulfur C-S-S-C type

- HT

